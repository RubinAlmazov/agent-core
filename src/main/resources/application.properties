spring.application.name=agent-core

spring.datasource.url=jdbc:postgresql://localhost:55433/agent_core
spring.datasource.username=agent
spring.datasource.password=agent
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

trading.enabled=false
trading.mode=DRY_RUN
trading.tickers[0]=SBER
trading.tickers[1]=GAZP
trading.tickers[2]=LKOH
trading.cycle-interval=60s

risk.max-position-share=0.25
risk.max-order-share=0.10
risk.daily-loss-limit=0.03
risk.min-confidence=0.65
risk.cooldown=5m
risk.max-trades-per-day=20

llm.provider=groq
llm.model=llama-3.1-70b-versatile
llm.api-key=${GROQ_API_KEY:}
