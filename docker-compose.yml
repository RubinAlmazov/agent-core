services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-core-postgres
    environment:
      POSTGRES_DB: agent_core
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "55432:5432"
    volumes:
      - agent_core_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_core"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agent_core_postgres_data:
